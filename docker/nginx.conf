# Serveur statique pour Pan360 FixExif (usage local).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # En local on veut toujours la dernière version des fichiers modifiés.
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Pas de fichiers cachés (.git, .env…)
    location ~ /\. {
        deny all;
    }
}
